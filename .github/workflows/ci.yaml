name: ROS 2 CI

# どのタイミングで実行するか
on:
  push:
    branches: [ main ] # main ブランチへの push
  pull_request:
    branches: [ main ] # main ブランチへの Pull Request

jobs:
  build_and_test:
    # 実行環境
    runs-on: ubuntu-latest

    # ROS 2 と Python 3.10 をセットアップ
    container: ros:humble-ros-base

    steps:
    # 1. リポジトリのコードをチェックアウト
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. ROS 2 のセットアップ
    - name: Set up ROS 2
      run: |
        source /opt/ros/humble/setup.bash
        apt-get update && apt-get install -y \
          python3-pip \
          python3-colcon-common-extensions \
          python3-pytest

    # 3. Python 依存関係のインストール (pre-commit ツール含む)
    - name: Install Python dependencies
      run: |
        pip3 install black flake8 pytest
        pip3 install -r requirements.txt # もしあれば

    # === チェックの実行 ===

    # 4. フォーマットチェック (Black)
    # --check オプションは「修正せずに、修正が必要ならエラー」にします
    - name: Run Black formatter check
      run: |
        black --check .

    # 5. リントチェック (Flake8)
    - name: Run Flake8 linter check
      run: |
        flake8 .

    # 6. colcon (ROS 2) ビルド
    - name: Build ROS 2 workspace
      run: |
        source /opt/ros/humble/setup.bash
        colcon build

    # 7. Pytest の実行
    - name: Run Pytest
      run: |
        source install/setup.bash
        colcon test
        colcon test-result --all # Display test results
