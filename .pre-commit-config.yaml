# .pre-commit-config.yaml
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0 # Check if this is the latest version
  hooks:
  - id: trailing-whitespace # Remove unnecessary spaces at the end of lines
  - id: end-of-file-fixer   # Insert a blank line at the end of files
  - id: check-yaml          # Check YAML file syntax
  - id: check-added-large-files # Prevent adding large files (such as model weights)

- repo: https://github.com/psf/black
  rev: 25.1.0 # Check if this is the latest version
  hooks:
  - id: black # Automatically format Python code
    language_version: python3.10

- repo: https://github.com/PyCQA/flake8
  rev: 7.1.0 # Check if this is the latest version
  hooks:
  - id: flake8 # Check for Python syntax/style errors
